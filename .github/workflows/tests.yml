name: Tests

on: [push, pull_request]

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          # Matches what Home Assistant itself is tested on; the test
          # harness leaves a stray shutdown thread behind on 3.13.
          python-version: "3.12"
      - run: pip install -r requirements-test.txt
      - run: pytest -q
