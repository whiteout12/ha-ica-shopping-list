name: Validate

on:
  push:
  pull_request:
  schedule:
    # ICA changes without telling anyone; so does hassfest. A weekly run means
    # a break is found before someone's shopping list stops working.
    - cron: "0 6 * * 1"

jobs:
  hassfest:
    name: hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master

  hacs:
    name: HACS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hacs/action@main
        with:
          category: integration
          # Brand assets live in home-assistant/brands, which is a submission
          # with its own review. This is a custom repository and installs fine
          # without them; drop this line when submitting to the HACS default
          # store, which is the only thing brands gates.
          ignore: brands
